version: "3.9"

services:
  # ── Main API server ──────────────────────────────────────
  cybersentinel:
    build: .
    container_name: cybersentinel-api
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      - REDIS_URL=redis://redis:6379/0
      - CYBERSENTINEL_DB=/data/cybersentinel.db
    volumes:
      - db_data:/data
      - ./templates:/app/templates:ro
      - ./static:/app/static:ro
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Redis cache ──────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: cybersentinel-redis
    ports:
      - "6379:6379"
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── Nginx reverse proxy ──────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: cybersentinel-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro    # Mount your SSL certs here
    depends_on:
      - cybersentinel
    restart: unless-stopped

volumes:
  db_data:
  redis_data:

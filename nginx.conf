events {
    worker_connections 1024;
}

http {
    # ── Upstream ─────────────────────────────────────────────
    upstream cybersentinel {
        server cybersentinel:8000;
        keepalive 32;
    }

    # ── Rate limiting ─────────────────────────────────────────
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/m;

    # ── Logging ───────────────────────────────────────────────
    log_format json_combined escape=json
        '{"time":"$time_local","remote_addr":"$remote_addr",'
        '"method":"$request_method","uri":"$request_uri",'
        '"status":"$status","bytes":"$body_bytes_sent",'
        '"duration":"$request_time"}';

    access_log /var/log/nginx/access.log json_combined;

    # ── HTTP → HTTPS redirect ─────────────────────────────────
    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    # ── HTTPS server ──────────────────────────────────────────
    server {
        listen 443 ssl http2;
        server_name your-domain.com;

        ssl_certificate     /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        # Security headers
        add_header X-Content-Type-Options  nosniff;
        add_header X-Frame-Options         DENY;
        add_header X-XSS-Protection        "1; mode=block";
        add_header Referrer-Policy         "strict-origin-when-cross-origin";

        # ── SSE — disable buffering so events stream immediately ──
        location /api/v2/analyse/stream {
            proxy_pass         http://cybersentinel;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";
            proxy_buffering    off;
            proxy_cache        off;
            proxy_read_timeout 300s;
            chunked_transfer_encoding on;
            limit_req zone=api burst=5 nodelay;
        }

        # ── Regular API routes ────────────────────────────────
        location /api/ {
            proxy_pass         http://cybersentinel;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
            client_max_body_size 10m;
            limit_req zone=api burst=10 nodelay;
        }

        # ── Static files ──────────────────────────────────────
        location /static/ {
            proxy_pass http://cybersentinel;
            expires 7d;
            add_header Cache-Control "public, immutable";
        }

        # ── Frontend / UI ─────────────────────────────────────
        location / {
            proxy_pass http://cybersentinel;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CyberSentinel v2</title>
<style>
  :root {
    --bg:        #080d18;
    --surface:   #0d1526;
    --surface2:  #111d35;
    --border:    #1a2744;
    --blue:      #0ea5e9;
    --blue-dim:  #0c2440;
    --green:     #22c55e;
    --green-dim: #0a2410;
    --red:       #ef4444;
    --red-dim:   #2a0808;
    --orange:    #f97316;
    --orange-dim:#2a1400;
    --yellow:    #eab308;
    --purple:    #a78bfa;
    --purple-dim:#1a1040;
    --text:      #e2e8f0;
    --text-muted:#64748b;
    --text-dim:  #334155;
    --mono:      'Courier New', monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', system-ui, sans-serif; min-height: 100vh; display: flex; flex-direction: column; }

  /* ── Header ─────────────────────────────────────────── */
  header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 0 24px; height: 56px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; }
  .logo { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 1rem; letter-spacing: 1px; color: var(--blue); }
  .logo svg { width: 22px; height: 22px; }
  .version-badge { background: var(--blue-dim); color: var(--blue); font-size: 0.65rem; font-weight: 700; padding: 2px 7px; border-radius: 4px; letter-spacing: 1px; }
  .header-actions { display: flex; gap: 10px; align-items: center; }
  .tab-btn { background: none; border: none; color: var(--text-muted); font-size: 0.82rem; cursor: pointer; padding: 6px 12px; border-radius: 6px; transition: all 0.15s; }
  .tab-btn.active, .tab-btn:hover { background: var(--surface2); color: var(--text); }

  /* ── Layout ─────────────────────────────────────────── */
  main { display: grid; grid-template-columns: 340px 1fr; flex: 1; min-height: 0; }
  @media (max-width: 780px) { main { grid-template-columns: 1fr; } }

  /* ── Left panel ─────────────────────────────────────── */
  .left-panel { border-right: 1px solid var(--border); display: flex; flex-direction: column; height: calc(100vh - 56px); }
  .panel-header { padding: 16px; border-bottom: 1px solid var(--border); font-size: 0.72rem; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; color: var(--text-muted); }

  textarea { width: 100%; flex: 1; background: transparent; border: none; resize: none; color: var(--text); font-size: 0.82rem; font-family: var(--mono); padding: 14px 16px; outline: none; line-height: 1.6; min-height: 200px; }
  textarea::placeholder { color: var(--text-dim); }

  .input-footer { padding: 12px 16px; border-top: 1px solid var(--border); display: flex; gap: 8px; align-items: center; }
  .btn-primary { background: var(--blue); color: #fff; border: none; padding: 8px 18px; border-radius: 6px; font-size: 0.82rem; font-weight: 600; cursor: pointer; transition: opacity 0.15s; display: flex; align-items: center; gap: 6px; }
  .btn-primary:hover { opacity: 0.85; }
  .btn-primary:disabled { opacity: 0.4; cursor: not-allowed; }
  .btn-secondary { background: var(--surface2); color: var(--text-muted); border: 1px solid var(--border); padding: 8px 14px; border-radius: 6px; font-size: 0.8rem; cursor: pointer; }
  .btn-secondary:hover { color: var(--text); }

  .deep-scan-toggle { display: flex; align-items: center; gap: 6px; font-size: 0.75rem; color: var(--text-muted); margin-left: auto; cursor: pointer; user-select: none; }
  .toggle { width: 32px; height: 18px; background: var(--border); border-radius: 9px; position: relative; transition: background 0.2s; cursor: pointer; }
  .toggle.on { background: var(--blue); }
  .toggle::after { content: ''; width: 12px; height: 12px; background: #fff; border-radius: 50%; position: absolute; top: 3px; left: 3px; transition: left 0.2s; }
  .toggle.on::after { left: 17px; }

  /* ── Right panel ─────────────────────────────────────── */
  .right-panel { display: flex; flex-direction: column; height: calc(100vh - 56px); overflow: hidden; }

  /* ── Views ───────────────────────────────────────────── */
  .view { display: none; flex: 1; flex-direction: column; overflow: hidden; }
  .view.active { display: flex; }

  /* ── Idle view ───────────────────────────────────────── */
  .idle-view { justify-content: center; align-items: center; gap: 12px; }
  .idle-icon { font-size: 3rem; opacity: 0.15; }
  .idle-text { color: var(--text-muted); font-size: 0.88rem; }

  /* ── Investigation view ──────────────────────────────── */
  .investigation-view { overflow-y: auto; padding: 20px 24px; gap: 10px; }

  .agent-track { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; margin-bottom: 10px; }
  .agent-track-header { display: flex; align-items: center; gap: 10px; padding: 10px 14px; background: var(--surface2); font-size: 0.78rem; font-weight: 600; }
  .agent-badge { font-size: 0.62rem; font-weight: 700; padding: 2px 7px; border-radius: 3px; letter-spacing: 1px; text-transform: uppercase; }
  .badge-orchestrator { background: var(--purple-dim); color: var(--purple); }
  .badge-email        { background: var(--blue-dim); color: var(--blue); }
  .badge-url          { background: var(--green-dim); color: var(--green); }
  .badge-report       { background: var(--orange-dim); color: var(--orange); }

  .agent-events { padding: 10px 14px; display: flex; flex-direction: column; gap: 6px; }
  .event-line { font-size: 0.78rem; display: flex; align-items: flex-start; gap: 8px; }
  .event-icon { flex-shrink: 0; width: 16px; text-align: center; margin-top: 1px; }
  .event-text { color: var(--text-muted); line-height: 1.5; font-family: var(--mono); }
  .event-text.reasoning { color: var(--text); font-family: inherit; font-style: italic; }
  .event-text.tool { color: var(--yellow); }
  .event-text.result { color: var(--green); }
  .event-text.error { color: var(--red); }

  /* ── Report view ──────────────────────────────────────── */
  .report-view { overflow-y: auto; padding: 24px; }
  .report-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; max-width: 780px; }
  .report-top { padding: 20px 24px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border); }
  .threat-badge { font-size: 0.85rem; font-weight: 700; padding: 6px 14px; border-radius: 6px; }
  .threat-CRITICAL { background: var(--red-dim);    color: var(--red);    border: 1px solid #7f1d1d; }
  .threat-HIGH     { background: var(--orange-dim); color: var(--orange); border: 1px solid #7c2d12; }
  .threat-MEDIUM   { background: #1a1500;            color: var(--yellow); border: 1px solid #713f12; }
  .threat-LOW      { background: var(--green-dim);   color: var(--green);  border: 1px solid #14532d; }
  .threat-CLEAN    { background: var(--green-dim);   color: var(--green);  border: 1px solid #14532d; }
  .score-ring { font-size: 0.75rem; color: var(--text-muted); }
  .score-val { font-size: 1.4rem; font-weight: 700; color: var(--text); }

  .report-section { padding: 16px 24px; border-bottom: 1px solid var(--border); }
  .report-section:last-child { border-bottom: none; }
  .section-title { font-size: 0.68rem; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; color: var(--text-muted); margin-bottom: 10px; }
  .narrative { font-size: 0.85rem; line-height: 1.7; color: var(--text); white-space: pre-wrap; }
  .indicator-list { list-style: none; display: flex; flex-direction: column; gap: 5px; }
  .indicator-list li { font-size: 0.8rem; color: var(--text-muted); line-height: 1.5; }
  .action-box { background: var(--surface2); border-radius: 8px; padding: 12px 14px; font-size: 0.83rem; color: var(--text); line-height: 1.6; }
  .meta-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .meta-item { font-size: 0.75rem; }
  .meta-item .label { color: var(--text-muted); margin-bottom: 2px; }
  .meta-item .value { color: var(--text); font-weight: 500; }
  .confidence-HIGH   { color: var(--green); }
  .confidence-MEDIUM { color: var(--yellow); }
  .confidence-LOW    { color: var(--text-muted); }

  /* ── Cases panel ──────────────────────────────────────── */
  .cases-panel { overflow-y: auto; }
  .case-row { display: flex; align-items: center; gap: 12px; padding: 12px 20px; border-bottom: 1px solid var(--border); cursor: pointer; transition: background 0.1s; }
  .case-row:hover { background: var(--surface2); }
  .case-sev { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .sev-CRITICAL { background: var(--red); }
  .sev-HIGH     { background: var(--orange); }
  .sev-MEDIUM   { background: var(--yellow); }
  .sev-LOW      { background: var(--green); }
  .case-id { font-family: var(--mono); font-size: 0.78rem; color: var(--blue); }
  .case-preview { font-size: 0.75rem; color: var(--text-muted); flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .case-time { font-size: 0.68rem; color: var(--text-dim); flex-shrink: 0; }

  /* ── Spinner ──────────────────────────────────────────── */
  @keyframes spin { to { transform: rotate(360deg); } }
  .spinner { width: 14px; height: 14px; border: 2px solid var(--border); border-top-color: var(--blue); border-radius: 50%; animation: spin 0.7s linear infinite; flex-shrink: 0; }

  /* ── Progress bar ────────────────────────────────────── */
  .progress-bar { height: 2px; background: var(--border); overflow: hidden; }
  .progress-fill { height: 100%; background: var(--blue); width: 0%; transition: width 0.4s; }

  /* ── Pulse dot ───────────────────────────────────────── */
  @keyframes pulse { 0%,100%{opacity:1}50%{opacity:.3} }
  .pulse { width: 6px; height: 6px; border-radius: 50%; background: var(--green); animation: pulse 1.2s infinite; }

  /* ── Hunt bar ────────────────────────────────────────── */
  .hunt-bar { padding: 14px 20px; border-bottom: 1px solid var(--border); display: flex; gap: 8px; }
  .hunt-input { flex: 1; background: var(--surface2); border: 1px solid var(--border); color: var(--text); padding: 7px 12px; border-radius: 6px; font-size: 0.8rem; outline: none; }
  .hunt-input:focus { border-color: var(--blue); }
  .hunt-results { padding: 16px 20px; font-size: 0.8rem; color: var(--text-muted); }
</style>
</head>
<body>

<header>
  <div class="logo">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
    </svg>
    CYBERSENTINEL
    <span class="version-badge">v2.0</span>
  </div>
  <div class="header-actions">
    <button class="tab-btn active" onclick="switchTab('analyse')">Analyse</button>
    <button class="tab-btn" onclick="switchTab('cases')">Cases</button>
    <button class="tab-btn" onclick="switchTab('hunt')">Hunt</button>
  </div>
</header>

<main>
  <!-- ── Left panel ─────────────────────────────────────── -->
  <div class="left-panel">
    <div class="panel-header">Input — Email or URL</div>
    <textarea id="input" placeholder="Paste a suspicious email (headers + body) or just a URL...

Examples:
• From: security@paypa1.com
  Subject: URGENT: Account suspended
  Click here: https://paypa1-verify.xyz/login

• https://suspicious-domain.xyz/verify"></textarea>
    <div class="input-footer">
      <button class="btn-primary" id="analyseBtn" onclick="startAnalysis()">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
        Analyse
      </button>
      <button class="btn-secondary" onclick="clearAll()">Clear</button>
      <label class="deep-scan-toggle">
        <div class="toggle" id="deepToggle" onclick="toggleDeep()"></div>
        Deep scan
      </label>
    </div>
  </div>

  <!-- ── Right panel ─────────────────────────────────────── -->
  <div class="right-panel">
    <div class="progress-bar"><div class="progress-fill" id="progress"></div></div>

    <!-- Analyse tab -->
    <div class="view active" id="analyse-tab">
      <div class="view idle-view" id="idleView" style="display:flex">
        <div class="idle-icon">🛡️</div>
        <div class="idle-text">Paste an email or URL in the left panel and click Analyse</div>
      </div>

      <div class="view investigation-view" id="investigationView" style="display:none; overflow-y:auto; flex-direction:column; gap:0; padding:20px 24px;">
        <div id="agentTracks"></div>
      </div>

      <div class="view report-view" id="reportView" style="display:none; overflow-y:auto; padding:24px;">
        <div id="reportCard"></div>
      </div>
    </div>

    <!-- Cases tab -->
    <div class="view" id="cases-tab">
      <div class="panel-header" style="padding:16px 20px">Recent Cases</div>
      <div class="cases-panel" id="casesList" style="flex:1;overflow-y:auto;">
        <div style="padding:24px;color:var(--text-muted);font-size:0.82rem;">Loading cases...</div>
      </div>
    </div>

    <!-- Hunt tab -->
    <div class="view" id="hunt-tab">
      <div class="panel-header" style="padding:16px 20px">Threat Hunting — Search by IOC</div>
      <div class="hunt-bar">
        <input class="hunt-input" id="huntInput" placeholder="Enter URL, IP, domain, or email address..." onkeydown="if(event.key==='Enter')huntIOC()">
        <button class="btn-primary" onclick="huntIOC()">Search</button>
      </div>
      <div class="hunt-results" id="huntResults">Search across all past cases for any IOC.</div>
    </div>
  </div>
</main>

<script>
  let deepScan = false;
  let currentEventSource = null;
  let agentStates = {};
  let progressVal = 0;
  let progressInterval = null;

  // ── Tab switching ─────────────────────────────────────────
  function switchTab(tab) {
    document.querySelectorAll('.tab-btn').forEach((b,i) => b.classList.toggle('active', ['analyse','cases','hunt'][i] === tab));
    document.querySelectorAll('.view[id$="-tab"]').forEach(v => v.classList.remove('active'));
    document.getElementById(tab + '-tab').classList.add('active');
    if (tab === 'cases') loadCases();
  }

  function toggleDeep() {
    deepScan = !deepScan;
    document.getElementById('deepToggle').classList.toggle('on', deepScan);
  }

  // ── Analysis ──────────────────────────────────────────────
  function startAnalysis() {
    const input = document.getElementById('input').value.trim();
    if (!input) return;

    // Reset UI
    document.getElementById('idleView').style.display = 'none';
    document.getElementById('investigationView').style.display = 'flex';
    document.getElementById('reportView').style.display = 'none';
    document.getElementById('agentTracks').innerHTML = '';
    document.getElementById('analyseBtn').disabled = true;
    agentStates = {};
    progressVal = 0;
    setProgress(5);
    startProgressCrawl();

    if (currentEventSource) currentEventSource.close();

    fetch('/api/v2/analyse/stream', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ input, deep_scan: deepScan })
    }).then(resp => {
      const reader = resp.body.getReader();
      const decoder = new TextDecoder();
      let buffer = '';

      function pump() {
        reader.read().then(({ done, value }) => {
          if (done) { onStreamEnd(); return; }
          buffer += decoder.decode(value, { stream: true });
          const parts = buffer.split('\n\n');
          buffer = parts.pop();
          parts.forEach(part => {
            const lines = part.split('\n');
            let eventType = 'message', data = '';
            lines.forEach(l => {
              if (l.startsWith('event: ')) eventType = l.slice(7);
              if (l.startsWith('data: '))  data = l.slice(6);
            });
            if (data) try { handleEvent(eventType, JSON.parse(data)); } catch(e) {}
          });
          pump();
        });
      }
      pump();
    }).catch(err => {
      addEventToAgent('orchestrator', 'error', '⚠️', `Connection error: ${err.message}`);
      onStreamEnd();
    });
  }

  function handleEvent(type, data) {
    setProgress(Math.min(progressVal + 6, 85));
    const agent = data.agent || 'orchestrator';

    switch(type) {
      case 'status':
        ensureAgentTrack(agent);
        addEventToAgent(agent, 'status', '🛡️', data.text || '');
        break;
      case 'thinking':
        ensureAgentTrack(agent);
        addEventToAgent(agent, 'status', '🧠', `Reasoning (step ${data.step})...`, true);
        break;
      case 'reasoning':
        addEventToAgent(agent, 'reasoning', '💬', data.text);
        break;
      case 'agent_delegated':
        addEventToAgent('orchestrator', 'status', '→', `Delegating to ${data.to.replace('delegate_to_','').replace('_agent','')} agent`);
        break;
      case 'tool_call':
        ensureAgentTrack(agent);
        addEventToAgent(agent, 'tool', '🔧', `Calling: ${data.tool || data.name}`);
        break;
      case 'tool_waiting':
        addEventToAgent(agent, 'status', '⏳', data.msg || 'Waiting for API...');
        break;
      case 'tool_result':
        addEventToAgent(agent, 'result', '✓', `${data.tool || data.name} completed`);
        break;
      case 'cache_hit':
        addEventToAgent(agent, 'result', '⚡', `Cache hit: ${data.url}`);
        break;
      case 'report':
        renderReport(data.report || data);
        break;
      case 'error':
        addEventToAgent(agent, 'error', '⚠️', data.message || 'Error');
        break;
      case 'end':
        onStreamEnd();
        break;
    }
  }

  function ensureAgentTrack(agent) {
    if (agentStates[agent]) return;
    agentStates[agent] = true;
    const labels = {
      orchestrator: ['🧠 Orchestrator', 'badge-orchestrator'],
      email_agent:  ['📧 Email Agent',  'badge-email'],
      url_agent:    ['🔗 URL Agent',    'badge-url'],
      report_agent: ['📋 Report Agent', 'badge-report'],
    };
    const [label, badge] = labels[agent] || [agent, 'badge-orchestrator'];
    const track = document.createElement('div');
    track.className = 'agent-track';
    track.id = 'track-' + agent;
    track.innerHTML = `
      <div class="agent-track-header">
        <span class="agent-badge ${badge}">${label.split(' ').slice(1).join(' ')}</span>
        <span style="font-size:0.82rem">${label.split(' ')[0]} ${label.split(' ').slice(1).join(' ')}</span>
        <span class="spinner" id="spinner-${agent}" style="margin-left:auto"></span>
      </div>
      <div class="agent-events" id="events-${agent}"></div>`;
    document.getElementById('agentTracks').appendChild(track);
  }

  function addEventToAgent(agent, type, icon, text, isSpinner) {
    ensureAgentTrack(agent);
    const container = document.getElementById('events-' + agent);
    if (!container) return;
    const el = document.createElement('div');
    el.className = 'event-line';
    el.innerHTML = `<span class="event-icon">${icon}</span><span class="event-text ${type}">${escHtml(text)}</span>`;
    container.appendChild(el);
    container.scrollIntoView({ behavior: 'smooth', block: 'end' });
  }

  function onStreamEnd() {
    document.getElementById('analyseBtn').disabled = false;
    stopProgressCrawl();
    setProgress(100);
    setTimeout(() => setProgress(0), 800);
    document.querySelectorAll('[id^="spinner-"]').forEach(s => s.style.display = 'none');
  }

  // ── Report rendering ──────────────────────────────────────
  function renderReport(report) {
    if (!report || !report.threat_level) return;
    setProgress(95);

    const level = report.threat_level || 'UNKNOWN';
    const score = report.composite_score || 0;
    const indicators = (report.indicators || []).slice(0, 8);
    const action = report.recommended_action || '';
    const narrative = report.narrative || '';
    const confidence = report.confidence || 'LOW';
    const emailSummary = report.email_summary || {};
    const urlSummaries = report.url_summaries || [];

    let emailHtml = '';
    if (emailSummary.sender_domain) {
      emailHtml = `
        <div class="report-section">
          <div class="section-title">Email Analysis</div>
          <div class="meta-grid">
            <div class="meta-item"><div class="label">Sender Domain</div><div class="value">${emailSummary.sender_domain || 'N/A'}</div></div>
            <div class="meta-item"><div class="label">Domain Mismatch</div><div class="value" style="color:${emailSummary.domain_mismatch ? 'var(--red)' : 'var(--green)'}">${emailSummary.domain_mismatch ? 'YES ⚠️' : 'No'}</div></div>
            <div class="meta-item"><div class="label">SPF / DKIM / DMARC</div><div class="value">${emailSummary.spf||'?'} / ${emailSummary.dkim||'?'} / ${emailSummary.dmarc||'?'}</div></div>
            <div class="meta-item"><div class="label">Embedded URLs</div><div class="value">${emailSummary.embedded_urls || 0}</div></div>
            ${emailSummary.impersonated_brands?.length ? `<div class="meta-item" style="grid-column:1/-1"><div class="label">Brand Impersonation</div><div class="value" style="color:var(--red)">${emailSummary.impersonated_brands.join(', ')}</div></div>` : ''}
          </div>
        </div>`;
    }

    let urlHtml = '';
    if (urlSummaries.length > 0) {
      urlHtml = `<div class="report-section"><div class="section-title">URL Analysis (${urlSummaries.length})</div>` +
        urlSummaries.map(u => `
          <div style="margin-bottom:10px;padding:10px 12px;background:var(--surface2);border-radius:6px;">
            <div style="font-family:var(--mono);font-size:0.72rem;color:var(--blue);margin-bottom:6px;word-break:break-all">${escHtml((u.url||'').slice(0,80))}${(u.url||'').length>80?'…':''}</div>
            <div style="display:flex;gap:16px;font-size:0.75rem;">
              <span>Score: <b style="color:${scoreColor(u.score)}">${u.score||0}/100</b></span>
              <span>VT: <b style="color:${u.vt_malicious>0?'var(--red)':'var(--green)'}">${u.vt_malicious||0} engines</b></span>
              ${u.domain_age_days!==null&&u.domain_age_days!==undefined ? `<span>Domain age: <b>${u.domain_age_days}d</b></span>` : ''}
              ${u.ip_abuse_score!==null&&u.ip_abuse_score!==undefined ? `<span>IP abuse: <b>${u.ip_abuse_score}</b></span>` : ''}
            </div>
          </div>`).join('') + '</div>';
    }

    document.getElementById('reportCard').innerHTML = `
      <div class="report-card">
        <div class="report-top">
          <div>
            <div style="font-size:0.68rem;color:var(--text-muted);letter-spacing:1px;text-transform:uppercase;margin-bottom:6px">Threat Assessment</div>
            <span class="threat-badge threat-${level}">${level}</span>
          </div>
          <div style="text-align:right">
            <div class="score-val" style="color:${scoreColor(score)}">${score}</div>
            <div class="score-ring">/ 100 — <span class="confidence-${confidence}">${confidence} confidence</span></div>
          </div>
        </div>

        ${narrative ? `<div class="report-section"><div class="section-title">Summary</div><div class="narrative">${escHtml(narrative)}</div></div>` : ''}

        ${indicators.length ? `
          <div class="report-section">
            <div class="section-title">Indicators (${indicators.length})</div>
            <ul class="indicator-list">${indicators.map(i => `<li>${escHtml(i)}</li>`).join('')}</ul>
          </div>` : ''}

        ${emailHtml}
        ${urlHtml}

        <div class="report-section">
          <div class="section-title">Recommended Action</div>
          <div class="action-box">${escHtml(action)}</div>
        </div>
      </div>`;

    // Switch to report view with a brief delay so user sees investigation finish
    setTimeout(() => {
      document.getElementById('investigationView').style.display = 'none';
      document.getElementById('reportView').style.display = 'flex';
    }, 600);
  }

  function scoreColor(score) {
    if (score >= 80) return 'var(--red)';
    if (score >= 60) return 'var(--orange)';
    if (score >= 30) return 'var(--yellow)';
    return 'var(--green)';
  }

  // ── Cases ─────────────────────────────────────────────────
  async function loadCases() {
    try {
      const resp = await fetch('/api/v2/cases?limit=30');
      const cases = await resp.json();
      if (!cases.length) {
        document.getElementById('casesList').innerHTML = '<div style="padding:24px;color:var(--text-muted);font-size:0.82rem;">No cases yet. Run your first analysis.</div>';
        return;
      }
      document.getElementById('casesList').innerHTML = cases.map(c => `
        <div class="case-row" onclick="loadCase('${c.id}')">
          <div class="case-sev sev-${c.severity || 'LOW'}"></div>
          <div class="case-id">${c.id}</div>
          <div class="case-preview">${escHtml((c.original_input || '').slice(0, 60))}</div>
          <div class="case-time">${timeAgo(c.created_at)}</div>
        </div>`).join('');
    } catch(e) {
      document.getElementById('casesList').innerHTML = `<div style="padding:24px;color:var(--red);font-size:0.82rem;">Error loading cases: ${e.message}</div>`;
    }
  }

  async function loadCase(id) {
    try {
      const resp = await fetch(`/api/v2/cases/${id}`);
      const c = await resp.json();
      if (c.findings) {
        renderReport(c.findings.report || {
          threat_level: c.severity,
          composite_score: 0,
          indicators: [],
          recommended_action: 'Loaded from case history.',
          narrative: JSON.stringify(c.findings, null, 2).slice(0, 500)
        });
        switchTab('analyse');
        document.getElementById('investigationView').style.display = 'none';
        document.getElementById('reportView').style.display = 'flex';
      }
    } catch(e) { console.error(e); }
  }

  // ── Threat hunting ────────────────────────────────────────
  async function huntIOC() {
    const ioc = document.getElementById('huntInput').value.trim();
    if (!ioc) return;
    document.getElementById('huntResults').innerHTML = '<div style="color:var(--text-muted)">Searching...</div>';
    try {
      const resp = await fetch(`/api/v2/hunt/${encodeURIComponent(ioc)}`);
      const data = await resp.json();
      if (!data.cases_found) {
        document.getElementById('huntResults').innerHTML = `<div style="color:var(--text-muted)">No cases found containing: <code>${escHtml(ioc)}</code></div>`;
        return;
      }
      document.getElementById('huntResults').innerHTML = `
        <div style="margin-bottom:12px;color:var(--blue)">Found in <b>${data.cases_found}</b> case(s):</div>` +
        data.cases.map(c => `
          <div style="padding:8px 12px;background:var(--surface2);border-radius:6px;margin-bottom:6px;display:flex;gap:12px;align-items:center;cursor:pointer" onclick="switchTab('cases')">
            <div class="case-sev sev-${c.severity || 'LOW'}"></div>
            <code style="font-size:0.75rem;color:var(--blue)">${c.id}</code>
            <span style="font-size:0.75rem;color:var(--text-muted)">${c.ioc_type}</span>
            <span style="font-size:0.72rem;color:var(--text-dim);margin-left:auto">${timeAgo(c.first_seen)}</span>
          </div>`).join('');
    } catch(e) {
      document.getElementById('huntResults').innerHTML = `<div style="color:var(--red)">Error: ${e.message}</div>`;
    }
  }

  // ── Progress bar ──────────────────────────────────────────
  function setProgress(val) { progressVal = val; document.getElementById('progress').style.width = val + '%'; }
  function startProgressCrawl() {
    progressInterval = setInterval(() => { if (progressVal < 80) setProgress(progressVal + 0.5); }, 400);
  }
  function stopProgressCrawl() { clearInterval(progressInterval); }

  // ── Utils ─────────────────────────────────────────────────
  function clearAll() {
    document.getElementById('input').value = '';
    document.getElementById('idleView').style.display = 'flex';
    document.getElementById('investigationView').style.display = 'none';
    document.getElementById('reportView').style.display = 'none';
    document.getElementById('agentTracks').innerHTML = '';
    setProgress(0);
  }

  function escHtml(str) {
    return String(str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function timeAgo(iso) {
    const diff = (Date.now() - new Date(iso)) / 1000;
    if (diff < 60) return 'just now';
    if (diff < 3600) return Math.floor(diff/60) + 'm ago';
    if (diff < 86400) return Math.floor(diff/3600) + 'h ago';
    return Math.floor(diff/86400) + 'd ago';
  }
</script>
</body>
</html>
